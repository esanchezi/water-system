<div class="dashboard-container" [class.is-mobile]="mobileQuery.matches">
  <mat-toolbar color="primary" class="dashboard-toolbar">
    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <img src="assets/img/logo.png" alt="Logo" class="app-logo" />
    <h1 class="app-name">Sistema de Agua Potable "{{ nombreComite$ | async }}"</h1>

    <div class="right">
      <ul>
        <li>
          <button mat-icon-button>
            <mat-icon>help_outline</mat-icon>
          </button>
        </li>
        <li>
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>person_outline</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="openChangePassword()">
              <mat-icon>lock_reset</mat-icon>
              Cambiar contraseña
            </button>
            <button mat-menu-item (click)="logout()">
              <mat-icon>exit_to_app</mat-icon>
              Cerrar Sesión
            </button>
          </mat-menu>
        </li>
      </ul>
    </div>
  </mat-toolbar>
  <!-- Empieza sidenav-->
  <mat-sidenav-container
    class="sidenav-container"
    [style.marginTop.px]="mobileQuery.matches ? 56 : 0"
  >
    <mat-sidenav
      #snav
      [mode]="mobileQuery.matches ? 'over' : 'side'"
      [fixedInViewport]="mobileQuery.matches"
      fixedTopGap="56"
    >
      <mat-nav-list>
        <!--profile-->
        <div class="profile-card">
          <div class="header">
            <h2>{{username}}</h2>
          </div>
        </div>
        <mat-divider></mat-divider>
        <div *ngFor="let grupo of visibleMenuGroups">
          <a mat-list-item class="grupo-header" (click)="toggleGrupo(grupo.name)">
            <mat-icon class="icono">{{ grupo.icon }}</mat-icon>
            {{ grupo.name }}
            <mat-icon class="expand-icon">{{ grupoAbierto(grupo.name) ? 'expand_less' : 'expand_more' }}</mat-icon>
          </a>
          <ng-container *ngIf="grupoAbierto(grupo.name)">
            <a mat-list-item class="submenu-item" [routerLink]="item.route" *ngFor="let item of grupo.items">
              <mat-icon class="icono">{{ item.icon }}</mat-icon>
              {{ item.name }}
            </a>
          </ng-container>
        </div>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
