<h2 mat-dialog-title>Nuevo grupo</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <div fxLayout="column" fxLayoutGap="8px">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="nombre del grupo" required />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Observaciones (opcional)</mat-label>
        <input matInput formControlName="observaciones" placeholder="observaciones" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid || guardando" (click)="save()">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
