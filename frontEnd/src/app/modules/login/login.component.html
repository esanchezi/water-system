<div class="login-container">
  <mat-card class="login-card">
    <div class="login-logo-wrap">
      <img src="assets/img/logo.png" alt="Logo" class="login-logo" />
    </div>
    <mat-card-title>Sistema de Agua - Los López</mat-card-title>
    <mat-card-subtitle>Inicia sesión para continuar</mat-card-subtitle>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        <p *ngIf="error" class="error">{{ error }}</p>

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="form.invalid || cargando">
          {{ cargando ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
