<div>
  <mat-card>
    <mat-card-content>
      <app-person-form [person]="person"></app-person-form>
    </mat-card-content>
  </mat-card>

    <mat-expansion-panel class="panel-usuario" *ngFor="let user of listWaterUser; trackBy: trackByUser">
        <mat-expansion-panel-header>
            <mat-panel-title>
            {{ user.person.nombre }} {{ user.person.nombre2 }} {{ user.person.app }} {{ user.person.apm }}
            </mat-panel-title>
            <mat-panel-description>
            Usuario #<a (click)="$event.stopPropagation(); irADetalleUsuario(user)" style="text-decoration: underline; cursor: pointer;" title="Ver ficha completa del usuario">{{ user.noUsuario }}</a> - {{ user.observaciones }}
            </mat-panel-description>
        </mat-expansion-panel-header>
        <app-user-receipt [usuario]="user"></app-user-receipt>
    </mat-expansion-panel>
</div>
