<h2 mat-dialog-title>{{ isEdit ? 'Editar valor general' : 'Nuevo valor general' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-container">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Concepto</mat-label>
      <mat-select formControlName="clave" [disabled]="isEdit">
        <mat-option *ngFor="let c of claves" [value]="c.clave">{{ c.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Año (vigencia)</mat-label>
      <input matInput type="number" formControlName="vigencia">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Monto</mat-label>
      <input matInput type="number" step="0.01" formControlName="monto">
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observaciones</mat-label>
      <textarea matInput formControlName="observaciones" rows="2"
                placeholder="Opcional"></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary"
          (click)="save()"
          [disabled]="form.invalid || saving">
    <mat-icon>save</mat-icon>
    {{ saving ? 'Guardando...' : 'Guardar' }}
  </button>
</mat-dialog-actions>
