# ======================
# LOGIN
# ======================
# El secreto real para firmar JWT y la contraseña inicial del admin NO deben
# vivir en texto plano aquí si el repo se comparte. Usa variables de entorno
# (JWT_SECRET / ADMIN_DEFAULT_PASSWORD) para sobreescribir estos valores por
# default -- son solo para que arranque en tu máquina la primera vez.
# La contraseña real del admin queda protegida (hash) en la base de datos en
# cuanto la cambies desde la pantalla de login/perfil.
jwt.secret=${JWT_SECRET:CambiaEstaClaveJWTPorUnaMuyLargaYUnicaAntesDeUsarEnProduccion1234567890}
jwt.expiration-ms=28800000
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:CambiaEstaClave123!}
